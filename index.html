<section id="calc">
  <h2>Онлайн-расчёт стоимости</h2>
  <form action="https://formspree.io/f/mayrklbp" method="POST">
    <label>Тип кухни:
      <select name="Тип кухни"><option>Прямая</option><option>Угловая</option><option>П-образная</option></select>
    </label>
    <label>Размер (примерно):<input name="Размер" type="text" placeholder="например 2.5 x 3 м"></label>
    <label>Фасады:<select name="Фасады"><option>Матовые</option><option>Глянец</option><option>Пластик</option></select></label>
    <label>Телефон:<input name="Телефон" type="tel" placeholder="+7..." required></label>
    <label>Комментарий:<textarea name="Комментарий" placeholder="Опишите ваши пожелания..."></textarea></label>
    <button type="submit">Получить расчёт</button>
  </form>
</section>
